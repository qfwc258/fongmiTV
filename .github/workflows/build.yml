name: Build Fongmi/TV APK

on:
  workflow_dispatch: {}  # 允许手动触发编译
  push:
    branches: [ fongmi ]  # 监听 fongmi 分支的推送事件

env:
  JAVA_VERSION: '17'
  ANDROID_BUILD_TOOLS: '34.0.0'
  PYTHON_VERSION: '3.10.13'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30  # 设置30分钟超时
    
    steps:
    # 第一步：检出代码（从您的fongmi分支）
    - name: Checkout fongmi branch
      uses: actions/checkout@v4
      with:
        ref: fongmi  # 明确指定分支
        submodules: recursive
        fetch-depth: 0

    # 第二步：设置JDK环境
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: ${{ env.JAVA_VERSION }}

    # 第三步：安装Python 3.10（关键步骤，解决Chaquopy问题）
    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    # 第四步：设置Android SDK
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        build-tools-version: ${{ env.ANDROID_BUILD_TOOLS }}
        cmdline-tools-version: 'latest'
        ndk-version: '25.2.9519653'

    # 第五步：缓存Gradle依赖，加速编译
    - name: Cache Gradle dependencies
      uses: actions/cache@v3
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          gradle-${{ runner.os }}-

    # 第六步：设置执行权限
    - name: Make gradlew executable
      run: chmod +x gradlew

    # 第七步：验证环境
    - name: Verify environment setup
      run: |
        echo "=== 环境检查 ==="
        echo "Python版本:"
        python3 --version
        echo ""
        echo "Java版本:"
        java -version
        echo ""
        echo "Gradle版本:"
        ./gradlew --version

    # 第八步：编译APK（关键：忽略Gradle警告）
    - name: Build Release APK
      env:
        ORG_GRADLE_PROJECT_pythonVersion: "3.10"
        ORG_GRADLE_PROJECT_buildPython: python3.10
      run: |
        echo "开始编译APK..."
        ./gradlew clean assembleRelease --warning-mode none
        echo "编译完成！"

    # 第九步：查找生成的APK文件
    - name: Find and list APK files
      run: |
        echo "=== 搜索APK文件 ==="
        find . -name "*.apk" -type f 2>/dev/null || echo "未找到APK文件"
        echo ""
        echo "=== 查看输出目录 ==="
        ls -la app/build/outputs/apk/ 2>/dev/null || echo "apk目录不存在"
        ls -la app/build/outputs/apk/release/ 2>/dev/null || echo "release目录不存在"

    # 第十步：上传生成的APK文件
    - name: Upload APK artifacts
      if: success()  # 只有在编译成功时才上传
      uses: actions/upload-artifact@v4
      with:
        name: fongmi-tv-apk
        path: |
          app/build/outputs/apk/**/*.apk
        retention-days: 7  # 保留7天
        if-no-files-found: warn  # 如果没找到文件，仅警告不失败
