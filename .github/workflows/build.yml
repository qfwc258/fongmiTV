name: Build Fongmi/TV APK

on:
  workflow_dispatch: {}  # 允许手动触发编译
  push:
    branches: [ fongmi ]  # 监听 fongmi 分支的推送事件

env:
  JAVA_VERSION: '17'
  PYTHON_VERSION: '3.10.13'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
    # 第一步：检出代码
    - name: Checkout fongmi branch
      uses: actions/checkout@v4
      with:
        ref: fongmi
        submodules: recursive
        fetch-depth: 0

    # 第二步：设置JDK环境
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: ${{ env.JAVA_VERSION }}

    # 第三步：安装Python 3.10
    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    # 第四步：设置Android SDK - 修正格式！
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        # 使用单行格式，用空格分隔包名
        packages: platform-tools build-tools;34.0.0 platforms;android-34 ndk;25.2.9519653
        accept-android-sdk-licenses: true

    # 第五步：缓存Gradle依赖
    - name: Cache Gradle dependencies
      uses: actions/cache@v3
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          gradle-${{ runner.os }}-

    # 第六步：设置执行权限
    - name: Make gradlew executable
      run: chmod +x gradlew

    # 第七步：验证环境
    - name: Verify environment setup
      run: |
        echo "=== 环境检查 ==="
        echo "Python版本:"
        python3 --version
        echo ""
        echo "Java版本:"
        java -version
        echo ""
        echo "Android SDK:"
        sdkmanager --list_installed 2>/dev/null || true

    # 第八步：编译APK
    - name: Build Release APK
      env:
        ORG_GRADLE_PROJECT_pythonVersion: "3.10"
        ORG_GRADLE_PROJECT_buildPython: python3.10
      run: |
        echo "开始编译APK..."
        ./gradlew clean assembleRelease --warning-mode none
        echo "编译完成！"

    # 第九步：查找APK文件
    - name: Find APK files
      run: |
        echo "=== 查找APK文件 ==="
        find . -name "*.apk" -type f 2>/dev/null || echo "搜索中..."
        echo ""
        echo "=== 输出目录 ==="
        ls -la app/build/outputs/apk/ 2>/dev/null || echo "创建目录中..."

    # 第十步：上传APK
    - name: Upload APK artifacts
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: fongmi-tv-apk
        path: app/build/outputs/apk/**/*.apk
        retention-days: 7
        if-no-files-found: warn
