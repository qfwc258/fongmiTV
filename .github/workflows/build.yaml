name: Build Fongmi/TV for fongmi branch

on:
  workflow_dispatch: {}  # 允许手动触发
  push:
    branches: [ fongmi ]  # 只监听 fongmi 分支的推送

env:
  JAVA_VERSION: '17'
  PYTHON_VERSION: '3.10'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
    - name: Checkout code from fongmi branch
      uses: actions/checkout@v4
      with:
        ref: fongmi
        submodules: recursive
        fetch-depth: 0

    - name: Set up JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: ${{ env.JAVA_VERSION }}

    - name: Set up Python 3.10 (for Chaquopy)
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Setup Android
      uses: android-actions/setup-android@v3
      with:
        build-tools-version: '34.0.0'

    - name: Make gradlew executable
      run: chmod +x gradlew

    - name: Build APK
      env:
        # Chaquopy 需要的环境变量
        ORG_GRADLE_PROJECT_pythonVersion: "3.10"
        CHAQUOPY_PYTHON: "python3.10"
      run: |
        ./gradlew assembleRelease

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: fongmi-tv-apk
        path: app/build/outputs/apk/**/*.apk
        if-no-files-found: warn
        retention-days: 7
